# NOIZY core stack on M2ULTRA — Forgejo + n8n (queue mode)
# Linear: NOI-174 (Forgejo), NOI-175 (n8n). Owner: RSP_001.
#
# Every port is bound to 127.0.0.1 only. Nothing is open to the network.
# Reach it from the iPhone through Cloudflare Tunnel + Access (NOI-179), never an open port.
#
# Start:   cp .env.example .env   (fill it in from Proton Pass)
#          bash preflight.sh && docker compose up -d
# Check:   bash stack-health.sh

name: noizy-core

services:
  forgejo:
    image: codeberg.org/forgejo/forgejo:15          # LTS line, supported to Jul 2027
    restart: unless-stopped
    environment:
      USER_UID: "1000"
      USER_GID: "1000"
      FORGEJO__server__ROOT_URL: ${FORGEJO_ROOT_URL}
      FORGEJO__server__SSH_PORT: "2222"
      FORGEJO__service__DISABLE_REGISTRATION: "true"   # single owner: RSP_001
      FORGEJO__repository__DEFAULT_BRANCH: main
      FORGEJO__actions__ENABLED: "true"                # Forgejo Actions (runner added separately)
      FORGEJO__webhook__ALLOWED_HOST_LIST: "n8n"       # webhooks may only reach n8n
    volumes:
      - ${NOIZY_DATA}/forgejo:/data
    ports:
      - "127.0.0.1:3300:3000"   # web
      - "127.0.0.1:2222:22"     # git over SSH
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/api/healthz"]
      interval: 30s
      retries: 5

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: n8n
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: ${N8N_DB_PASSWORD}
    volumes:
      - ${NOIZY_DATA}/n8n-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n -d n8n"]
      interval: 10s
      retries: 10

  redis:
    image: valkey/valkey:8          # BSD-licensed Redis fork
    restart: unless-stopped
    command: ["valkey-server", "--requirepass", "${N8N_REDIS_PASSWORD}"]
    volumes:
      - ${NOIZY_DATA}/n8n-redis:/data
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -a \"$N8N_REDIS_PASSWORD\" ping | grep PONG"]
      interval: 10s
      retries: 10
    environment:
      N8N_REDIS_PASSWORD: ${N8N_REDIS_PASSWORD}

  n8n:
    image: n8nio/n8n:${N8N_VERSION}
    restart: unless-stopped
    environment: &n8n_env
      EXECUTIONS_MODE: queue
      QUEUE_BULL_REDIS_HOST: redis
      QUEUE_BULL_REDIS_PORT: "6379"
      QUEUE_BULL_REDIS_PASSWORD: ${N8N_REDIS_PASSWORD}
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}       # must match on every worker
      GENERIC_TIMEZONE: America/Toronto
      TZ: America/Toronto
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_RUNNERS_ENABLED: "true"
      OFFLOAD_MANUAL_EXECUTIONS_TO_WORKERS: "true"
    volumes:
      - ${NOIZY_DATA}/n8n:/home/node/.n8n
    ports:
      - "127.0.0.1:5678:5678"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  n8n-worker:
    image: n8nio/n8n:${N8N_VERSION}
    restart: unless-stopped
    command: ["worker", "--concurrency=10"]
    environment: *n8n_env
    volumes:
      - ${NOIZY_DATA}/n8n:/home/node/.n8n
    depends_on:
      n8n: { condition: service_started }
    deploy:
      replicas: ${N8N_WORKERS:-4}   # 192 GB RAM: start at 4, raise after watching load
