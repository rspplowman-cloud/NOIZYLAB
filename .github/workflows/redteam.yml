# Red-team gate. Free checks run on every pull request; the live smoke run (Claude API,
# costs money) runs only when started by hand and the ANTHROPIC_API_KEY secret exists.
# Fast and clear: a new push cancels the old run for the same PR, every job has a
# 10-minute ceiling, and npm downloads are cached between runs.
name: redteam
on:
  pull_request:
  workflow_dispatch:
    inputs:
      live:
        description: "Run the live smoke set against the Claude API (costs money)"
        type: boolean
        default: false
concurrency:
  group: redteam-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  harness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults: { run: { working-directory: redteam/harness } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: redteam/harness/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run selftest
      - name: Live smoke (manual only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.live }}
        env: { ANTHROPIC_API_KEY: "${{ secrets.ANTHROPIC_API_KEY }}" }
        run: npm run smoke
  noizybkz:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults: { run: { working-directory: noizybkz } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: "22" }
      - run: npm test
  reminders:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults: { run: { working-directory: workers/reminders } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: "22" }
      - run: npm test
  cf-watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: "22" }
      - run: node scripts/cf-watch/cf_watch.mjs --dry-run
  agent-mcp:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults: { run: { working-directory: _mc96-common/gabriel/mcp } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: _mc96-common/gabriel/mcp/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
  gabriel:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults: { run: { working-directory: _mc96-common/gabriel } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            _mc96-common/gabriel/package-lock.json
            _mc96-common/gabriel/mcp/package-lock.json
            dreamchamber/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm ci --no-audit --no-fund
        working-directory: _mc96-common/gabriel/mcp
      - run: npm ci --no-audit --no-fund
        working-directory: dreamchamber
      - run: npm test   # typecheck + build, then intents through every boss over real MCP
  dreamchamber:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults: { run: { working-directory: dreamchamber } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dreamchamber/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
  noizystrmz:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults: { run: { working-directory: services/noizystrmz } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: services/noizystrmz/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test   # join tokens + the HALT gate (fails closed)
  noizy-contact:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults: { run: { working-directory: services/noizy-contact } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: services/noizy-contact/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test   # HALT gate (fails closed) + the M2Ultra link compiles
  talk:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults: { run: { working-directory: services/talk } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: services/talk/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test   # never-to-AI gate, phone key, HALT fails closed
  sovereign-git:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults: { run: { working-directory: scripts/sovereign-git } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: scripts/sovereign-git/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test   # HALT fails closed, name repairs, mirrors stay private
  ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults: { run: { working-directory: services/ledger } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: services/ledger/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults: { run: { working-directory: voice } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: voice/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test   # typecheck the pipeline + the voice MCP server starts and answers
  anthropic-watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults: { run: { working-directory: scripts/anthropic-watch } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: scripts/anthropic-watch/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: bash -n m2ultra-tune-up.sh
  noizyarmy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            services/noizyarmy/package-lock.json
            _mc96-common/gabriel/mcp/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: _mc96-common/gabriel/mcp
      - run: npm ci --no-audit --no-fund
        working-directory: services/noizyarmy
      - run: npm test   # rules, GABRIEL's contract, keys, HALT, and a real soldier end to end
        working-directory: services/noizyarmy
  archive-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: python3 -m unittest discover -s scripts/archive/test -v   # TaleSpin finder, deck reader, voice session
      - run: bash scripts/archive/test/test_cloud_rescue.sh   # encrypted, add-only, refuses the clicking drive
      - run: python3 -m unittest discover -s scripts/organize/test -v  # app map, Spotlight tags, video sort
      - run: python3 -m unittest discover -s services/covenant-math/test -v  # 75/25 math
  gabriel-voice:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: services/ledger/package-lock.json
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: npm ci --no-audit --no-fund
        working-directory: services/ledger
      - run: python3 -m unittest discover -s test -v   # consent gate, HALT, ledger chain across Python and Node, the 9799 service
        working-directory: services/gabriel-voice
