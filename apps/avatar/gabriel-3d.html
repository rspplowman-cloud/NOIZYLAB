<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GABRIEL 3D</title>
<!--
  GABRIEL's live 3D avatar.

  The model (gabriel.glb) is built from his portrait by apps/avatar/pipeline/ with
  Blender and open models only. This page gives it life: he breathes, looks about,
  blinks, turns his head toward you, and moves his mouth when he speaks.

  Private by design: three.js is in ./vendor (no script from the internet), and the
  page makes no network call except loading the model from its own folder. Listen
  reads how loud the room is and nothing else: nothing is recorded or sent.

  It must be served, not double-clicked (browsers block models loaded from file://):
      cd apps/avatar && python3 -m http.server 8777 --bind 127.0.0.1
      open http://127.0.0.1:8777/gabriel-3d.html

  Drive it from another page, or from the voice service:
      postMessage({ gabriel: { mood: "speaking", level: 0.6, caption: "...", weights: { jawOpen: 0.4 } } }, "*")
      gabriel-3d.html?ws=ws://127.0.0.1:9798     (same JSON over a WebSocket, loopback addresses only)
      gabriel-3d.html#thinking
      gabriel-3d.html?speak=pipeline/work/say/evening.json   (a line made by pipeline/05_speak.py: sound plus mouth track)
      gabriel-3d.html?live       (with serve.py: he speaks every line GABRIEL's voice service makes, as it is made)
  Moods: idle, listening, thinking, speaking, halted.
-->
<style>
  :root { --amber: 255, 176, 84; --glow: var(--amber); --level: 0; --ink: #f4ead8; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #0b0806; color: var(--ink); overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif; }
  .stage { position: fixed; inset: 0 0 92px 0; display: grid; place-items: center; }
  .rings { position: absolute; width: min(150vh, 150vw); aspect-ratio: 1; border-radius: 50%;
    background:
      radial-gradient(closest-side, rgba(var(--glow), calc(.10 + var(--level) * .45)) 0 34%, transparent 35%),
      radial-gradient(closest-side, transparent 0 44%, rgba(var(--glow), calc(.07 + var(--level) * .30)) 45% 46%, transparent 47%),
      radial-gradient(closest-side, transparent 0 58%, rgba(var(--glow), calc(.05 + var(--level) * .22)) 59% 60%, transparent 61%),
      radial-gradient(closest-side, transparent 0 74%, rgba(var(--glow), calc(.03 + var(--level) * .16)) 75% 76%, transparent 77%);
    animation: turn 90s linear infinite; }
  .frame { position: relative; height: min(calc(100vh - 112px), 144vw); aspect-ratio: 2 / 3; border-radius: 14px; overflow: hidden;
    background: #17110c;
    box-shadow: 0 0 0 1px rgba(var(--glow), .28), 0 0 calc(40px + var(--level) * 140px) rgba(var(--glow), calc(.18 + var(--level) * .5)),
      0 40px 120px rgba(0, 0, 0, .7); }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .light { position: absolute; inset: 0; pointer-events: none; mix-blend-mode: soft-light;
    background: radial-gradient(60% 45% at 50% 30%, rgba(var(--glow), calc(.08 + var(--level) * .5)), transparent 70%); }
  .shade { position: absolute; inset: 0; pointer-events: none; background: linear-gradient(to bottom, transparent 58%, rgba(8, 6, 4, .88) 100%); }
  .notice { position: absolute; inset: 0; display: none; place-items: center; text-align: center; padding: 8%;
    font-size: clamp(16px, 2.4vh, 22px); line-height: 1.5; color: #cdbfa8; }
  .notice.on { display: grid; }
  .plate { position: absolute; left: 0; right: 0; bottom: 0; padding: 0 6% 5.5%; text-align: center; pointer-events: none; }
  .name { font-size: clamp(20px, 3.4vh, 34px); font-weight: 700; letter-spacing: .34em; padding-left: .34em; }
  .state { margin-top: .5em; font-size: clamp(14px, 2vh, 20px); letter-spacing: .14em; text-transform: uppercase; color: rgb(var(--glow)); }
  .state::before { content: ""; display: inline-block; width: .62em; height: .62em; border-radius: 50%; margin-right: .6em;
    background: rgb(var(--glow)); box-shadow: 0 0 12px rgb(var(--glow)); }
  .caption { margin-top: .7em; min-height: 2.8em; font-size: clamp(17px, 2.5vh, 26px); line-height: 1.4; text-wrap: balance; }
  .controls { position: fixed; left: 0; right: 0; bottom: max(18px, env(safe-area-inset-bottom)); display: flex; gap: 14px; justify-content: center; }
  button { font: inherit; font-size: 18px; font-weight: 600; color: #1a120b; background: rgb(var(--amber)); border: 0;
    border-radius: 999px; padding: 14px 30px; min-width: 132px; min-height: 52px; cursor: pointer; }
  button:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  button[aria-pressed="true"] { background: #f4ead8; }
  body[data-mood="listening"] { --glow: 110, 200, 255; }
  body[data-mood="thinking"]  { --glow: 196, 160, 255; }
  body[data-mood="speaking"]  { --glow: 255, 196, 110; }
  body[data-mood="halted"]    { --glow: 255, 92, 80; }
  body[data-mood="halted"] canvas { filter: grayscale(.85) brightness(.75); }
  @keyframes turn { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .rings { animation: none; } }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three/build/three.module.min.js" } }
</script>
</head>
<body data-mood="idle">
  <main class="stage" aria-live="polite">
    <div class="rings" aria-hidden="true"></div>
    <div class="frame">
      <canvas id="view" role="img" aria-label="GABRIEL: an older man with long silver hair and a grey beard, in a dark three-piece suit, standing in a study. He moves and speaks."></canvas>
      <div class="notice" id="notice"></div>
      <div class="light" aria-hidden="true"></div>
      <div class="shade" aria-hidden="true"></div>
      <div class="plate">
        <div class="name">GABRIEL</div>
        <div class="state" id="state">Standing by</div>
        <div class="caption" id="caption"></div>
      </div>
    </div>
  </main>
  <div class="controls">
    <button id="speak" type="button">Speak</button>
    <button id="listen" type="button" aria-pressed="false">Listen</button>
  </div>

<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "./vendor/three/examples/jsm/loaders/GLTFLoader.js";

const MOODS = { idle: "Standing by", listening: "Listening", thinking: "Thinking", speaking: "Speaking", halted: "Halted" };
const params = new URLSearchParams(location.search);
const body = document.body, root = document.documentElement;
const canvas = document.getElementById("view"), notice = document.getElementById("notice");
const stateEl = document.getElementById("state"), captionEl = document.getElementById("caption");
const speakBtn = document.getElementById("speak"), listenBtn = document.getElementById("listen");
const calm = matchMedia("(prefers-reduced-motion: reduce)").matches || params.has("still");

// ── Scene ───────────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NoToneMapping;
const scene = new THREE.Scene();
// A flat (orthographic) camera: at rest the picture is exactly the portrait, with no stretching of near parts.
const ZOOM = 1.035; // a touch closer than the picture's edge, so the edge never shows when he moves
const camera = new THREE.OrthographicCamera(-0.5 / ZOOM, 0.5 / ZOOM, 0.75 / ZOOM, -0.75 / ZOOM, 0.01, 10);
camera.position.set(0, 0, 4);
function fit() {
  const r = canvas.getBoundingClientRect();
  renderer.setSize(Math.max(1, r.width), Math.max(1, r.height), false);
}
addEventListener("resize", fit);

// ── State ───────────────────────────────────────────────────
let mood = "idle", level = 0, target = 0, model = null, dict = null;
const parts = [];                // every mesh piece that carries the face shapes (skin, and the dark mouth interior)
const manual = {};               // weights set from outside; they win over the page's own animation
const now = () => performance.now() / 1000;
const look = { x: 0, y: 0, tx: 0, ty: 0 };
let nextBlink = now() + 2.5, blinkStart = -1;
let speech = null;               // { until, seed } while the browser voice is talking
let clip = null;                 // { audio, rate, shapes, words, text } while a prepared line is loaded
const MOUTH_GAIN = 0.6;          // tracks run 0 to 1; a relaxed speaking mouth uses about 60% of the bust's full opening
const pending = {};              // weights asked for before the model arrived

function setMood(next) {
  if (!(next in MOODS)) return false;
  mood = next; body.dataset.mood = next; stateEl.textContent = MOODS[next];
  if (next !== "speaking" && next !== "listening") target = 0;
  return true;
}
const setLevel = (v) => { target = Math.max(0, Math.min(1, Number(v) || 0)); };
const setCaption = (t) => { captionEl.textContent = String(t ?? "").slice(0, 240); };
function setWeights(w) {
  if (!w || typeof w !== "object") return;
  for (const [k, v] of Object.entries(w)) {
    if (v === null) delete manual[k];
    else if (Number.isFinite(Number(v))) manual[k] = Math.max(0, Math.min(1, Number(v)));
  }
}
function put(name, value) {
  const v = Math.max(0, Math.min(1, value));
  for (const part of parts) {
    const i = part.morphTargetDictionary[name];
    if (i !== undefined) part.morphTargetInfluences[i] = v;
  }
}

// ── Load the model ──────────────────────────────────────────
const src = params.get("glb") || "./gabriel.glb";
new GLTFLoader().load(src, (gltf) => {
  gltf.scene.traverse((o) => {
    if (!o.isMesh) return;
    // The portrait is already lit by its own lamps, so show it as it is: no scene lighting.
    const old = o.material;
    o.material = new THREE.MeshBasicMaterial({ map: old.map || null, color: old.map ? 0xffffff : old.color, side: THREE.DoubleSide });
    if (old.map && (old.transparent || old.alphaTest > 0 || old.name === "GabrielSkin")) { o.material.alphaTest = 0.5; o.material.alphaToCoverage = true; }
    if (o.morphTargetDictionary && "jawOpen" in o.morphTargetDictionary) {
      parts.push(o);
      if (o.material.map) { model = o; dict = o.morphTargetDictionary; }
    }
  });
  if (!model && parts.length) { model = parts[0]; dict = model.morphTargetDictionary; }
  scene.add(gltf.scene);
  if (!model) { notice.textContent = "The model loaded, but it has no face shapes."; notice.classList.add("on"); }
  window.gabriel.ready = true;
  window.gabriel.shapes = dict ? Object.keys(dict) : [];
  fit();
}, undefined, () => {
  notice.innerHTML = "GABRIEL's 3D model is not on this machine yet.<br>Build it with <code>apps/avatar/pipeline/build.sh</code>";
  notice.classList.add("on");
  window.gabriel.ready = false;
});

// ── Life ────────────────────────────────────────────────────
const wave = (t, a, b, c) => Math.sin(t * a) * 0.5 + Math.sin(t * b + 1.3) * 0.3 + Math.sin(t * c + 2.1) * 0.2;

function frame() {
  requestAnimationFrame(frame);
  const t = now();
  level += (target - level) * (target > level ? 0.35 : 0.08);
  root.style.setProperty("--level", level.toFixed(3));
  if (model) {
    const w = {};
    const alive = mood !== "halted";
    // Head: a slow drift of his own, plus a turn toward the pointer.
    look.x += (look.tx - look.x) * 0.06; look.y += (look.ty - look.y) * 0.06;
    let yaw = look.x * 0.75, pitch = look.y * 0.6;
    if (alive && !calm) { yaw += wave(t, 0.23, 0.41, 0.13) * 0.22; pitch += wave(t, 0.19, 0.31, 0.11) * 0.16; }
    if (mood === "thinking") { yaw += 0.25; pitch += 0.3; }
    if (mood === "listening") pitch -= 0.12;
    w.headYawLeft = Math.max(0, yaw); w.headYawRight = Math.max(0, -yaw);
    w.headPitchUp = Math.max(0, pitch); w.headPitchDown = Math.max(0, -pitch);
    // Blink.
    if (alive && !calm && blinkStart < 0 && t > nextBlink) blinkStart = t;
    let blink = 0;
    if (blinkStart >= 0) {
      const p = (t - blinkStart) / 0.22;
      blink = p >= 1 ? 0 : Math.sin(p * Math.PI);
      if (p >= 1) { blinkStart = -1; nextBlink = t + 2.2 + Math.random() * 3.8; }
    }
    w.eyeBlinkLeft = blink; w.eyeBlinkRight = blink;
    // Brows.
    w.browInnerUp = mood === "listening" ? 0.5 : mood === "thinking" ? 0.15 : 0;
    w.browDownLeft = w.browDownRight = mood === "thinking" ? 0.55 : 0;
    // Mouth: follows the sound level; the shape wanders between open, round and wide so it reads as speech.
    let jaw = 0, pucker = 0, smile = 0;
    if (clip && !clip.audio.paused && !clip.audio.ended) {
      // A prepared line: the mouth follows the track at the sound's own clock, so they cannot drift apart.
      const time = clip.audio.currentTime;
      const i = Math.min(clip.length - 1, Math.max(0, Math.floor(time * clip.rate)));
      jaw = (clip.shapes.jawOpen[i] || 0) * MOUTH_GAIN;
      pucker = (clip.shapes.mouthPucker[i] || 0) * MOUTH_GAIN;
      smile = (clip.shapes.mouthSmileLeft[i] || 0) * MOUTH_GAIN;
      target = Math.min(1, jaw * 2.2);
      captionAt(time);
    } else if (mood === "speaking") {
      const lv = speech ? speechEnvelope(t) : level;
      const shapeMix = wave(t, 7.1, 11.3, 4.7);
      jaw = lv * (0.34 + 0.12 * Math.sin(t * 13));
      pucker = lv * Math.max(0, shapeMix) * 0.7;
      smile = lv * Math.max(0, -shapeMix) * 0.5;
      if (speech) { target = lv; if (t > speech.until) endSpeech(); }
    }
    w.jawOpen = jaw; w.mouthPucker = pucker; w.mouthSmileLeft = w.mouthSmileRight = smile;
    for (const k of Object.keys(dict)) put(k, k in manual ? manual[k] : (w[k] || 0));
    // Breath: the whole figure rises and falls a hair.
    model.parent.position.y = alive && !calm ? Math.sin(t * 0.95) * 0.0022 : 0;
  }
  renderer.render(scene, camera);
}
fit(); frame();

addEventListener("pointermove", (e) => {
  const r = canvas.getBoundingClientRect();
  look.tx = Math.max(-1, Math.min(1, ((e.clientX - r.left) / r.width - 0.5) * 2));
  look.ty = Math.max(-1, Math.min(1, (0.35 - (e.clientY - r.top) / r.height) * 2));
});
addEventListener("pointerleave", () => { look.tx = 0; look.ty = 0; });

// ── Speak: the browser's own voice, on this machine ─────────
// The browser gives no sound level for its own voice, so the mouth follows a speech-like rhythm for the length of the line.
function speechEnvelope(t) {
  const s = Math.max(0, Math.sin(t * 9.5 + speech.seed)) * (0.6 + 0.4 * Math.sin(t * 2.3 + speech.seed));
  return Math.min(1, 0.15 + s * 0.85);
}
function endSpeech() { speech = null; setLevel(0); setMood("idle"); }
function say(text) {
  text = String(text ?? "");
  setCaption(text); setMood("speaking");
  speech = { until: now() + Math.min(20, 0.9 + text.length * 0.06), seed: Math.random() * 6 };
  if ("speechSynthesis" in window && speechSynthesis.getVoices().length) {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.rate = 0.95; u.pitch = 0.85;
    u.onend = endSpeech; u.onerror = () => {};
    speechSynthesis.speak(u);
  }
}
// ── A prepared line: sound plus mouth track, made by pipeline/05_speak.py ──
function captionAt(time) {
  if (!clip.words.length || clip.text.length <= 150) return;      // short lines stay whole on screen
  let k = clip.words.findIndex((w) => w.t1 > time);
  if (k < 0) k = clip.words.length - 1;
  const from = Math.max(0, k - 9);
  setCaption(clip.words.slice(from, from + 14).map((w) => w.text).join(" "));
}
async function load(url) {
  const at = new URL(url, location.href);
  if (at.origin !== location.origin) throw new Error("lines are only loaded from this page's own folder");
  const data = await (await fetch(at)).json();
  const shapes = data.track.shapes;
  const audio = new Audio(new URL(data.audio, at).href);
  audio.preload = "auto";
  clip = { audio, rate: data.track.rate, shapes, length: shapes.jawOpen.length, words: data.words || [], text: data.text || "" };
  audio.addEventListener("ended", () => { setLevel(0); setMood("idle"); });
  return clip;
}
async function play(url) {
  if (url) await load(url);
  if (!clip) return false;
  speech = null;
  if ("speechSynthesis" in window) speechSynthesis.cancel();
  clip.audio.currentTime = 0;
  setCaption(clip.text); setMood("speaking");
  try { await clip.audio.play(); return true; }
  catch { setMood("idle"); setCaption("Press Speak to hear me."); return false; }   // browsers hold sound until a first tap
}
speakBtn.addEventListener("click", () => { if (clip) play(); else say("GABRIEL online. Standing by, RSP_001."); });
if (params.get("speak")) play(params.get("speak")).catch((e) => setCaption(String(e.message || e)));

// ── Listen: the microphone level only. Nothing is recorded or sent. ──
let mic = null;
listenBtn.addEventListener("click", async () => {
  if (mic) {
    mic.stream.getTracks().forEach((tr) => tr.stop()); await mic.ctx.close(); mic = null;
    listenBtn.setAttribute("aria-pressed", "false"); setMood("idle"); setCaption(""); return;
  }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const ctx = new AudioContext(), an = ctx.createAnalyser(); an.fftSize = 512;
    ctx.createMediaStreamSource(stream).connect(an);
    const data = new Uint8Array(an.fftSize); mic = { stream, ctx };
    listenBtn.setAttribute("aria-pressed", "true"); setMood("listening"); setCaption("I am listening.");
    (function read() {
      if (!mic) return;
      an.getByteTimeDomainData(data);
      let sum = 0; for (const v of data) sum += (v - 128) * (v - 128);
      setLevel(Math.min(1, Math.sqrt(sum / data.length) / 40));
      requestAnimationFrame(read);
    })();
  } catch { setCaption("The microphone is not available."); }
});

// ── Driven from outside ─────────────────────────────────────
function apply(m) {
  if (!m || typeof m !== "object") return;
  if (m.mood !== undefined) setMood(String(m.mood));
  if (m.level !== undefined) setLevel(m.level);
  if (m.caption !== undefined) setCaption(m.caption);
  if (m.weights !== undefined) setWeights(m.weights);
  if (m.say !== undefined) say(m.say);
  if (m.play !== undefined) play(String(m.play)).catch((e) => setCaption(String(e.message || e)));
}
addEventListener("message", (e) => apply(e.data && e.data.gabriel));
const fromHash = () => setMood(location.hash.slice(1));
addEventListener("hashchange", fromHash); fromHash();

// Live: serve.py tells this page each time GABRIEL's voice service has made a new line.
if (params.has("live")) {
  const feed = new EventSource("events");
  feed.onmessage = (e) => { try { apply(JSON.parse(e.data)); } catch { /* not for us */ } };
  window.gabriel_feed = feed;
}

// Optional live feed from the voice service. Loopback addresses only: this page never connects out.
const ws = params.get("ws");
if (ws && /^ws:\/\/(127\.0\.0\.1|localhost|\[::1\])(:\d+)?(\/|$)/.test(ws)) {
  (function connect() {
    const sock = new WebSocket(ws);
    sock.onmessage = (e) => { try { apply(JSON.parse(e.data)); } catch { /* not for us */ } };
    sock.onclose = () => setTimeout(connect, 2000);
  })();
}

window.gabriel = { setMood, setLevel, setCaption, setWeights, say, play, playing: () => !!clip && !clip.audio.paused && !clip.audio.ended, moods: Object.keys(MOODS), ready: null, shapes: [],
  state: () => ({ mood, level, target, weights: model ? Object.fromEntries(Object.entries(dict).map(([k, i]) => [k, +model.morphTargetInfluences[i].toFixed(3)])) : {} }) };
</script>
</body>
</html>
